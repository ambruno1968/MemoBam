name: Release MemoBam

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish win-x64
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Path "dist/$tag" -Force | Out-Null
          dotnet publish MemoBam.csproj -c Release -r win-x64 --self-contained false -o "dist/$tag"
          Compress-Archive -Path "dist/$tag/*" -DestinationPath "dist/MemoBam-$tag-win-x64.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MemoBam-*.zip
          generate_release_notes: true
